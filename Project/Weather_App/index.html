<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <h1>hello</h1> -->\
     <div class="card">
        <div class="search" >
            <input type="text" placeholder="enter you city"  spellcheck="false" name="" id="">
            <button><img src="/images/search.png" alt=""></button>
        </div>
        <p class="err"  >Invalid City </p>
        <div class="weather">
            <img src="/images/rain.png" class="weather-icon">
            <h1 class="temp" >22°C</h1>
            <h2 class="city" >Pune</h2>
            <div class="details" >
                <div class="col" >
                    <img src="images/humidity.png" alt="">
                    <div>
                        <p class="humidity" >50%</p>
                        <p>humidity</p>
                    </div>
                </div>
                <div class="col" >
                    <img src="images/wind.png" alt="">
                    <div>
                        <p class="wind" >15 km/hr </p>
                        <p>Wind speed</p>
                    </div>
                </div>
            </div>
        </div>
     </div>
     <script>
        const apikey = "daf38eb254a23d38db0e4bbd92749fe0";
        const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q="
        const searchinp = document.querySelector(".search input")
        const searchbtn = document.querySelector(".search button")

        let imgg = document.querySelector(".weather-icon")

        console.log(searchinp.value)
        console.log(searchbtn)

        async function checkweather(city){

                const resp = await fetch(apiurl+ city +  `&appid=${apikey}`)
                let data = await resp.json();
                if(resp.status === 404){
                    document.querySelector(".err").style.display = "block"
                    document.querySelector(".weather").style.display = "none" ;
                }else{

                
                console.log(data)
                document.querySelector(".city").textContent = data.name;
                document.querySelector(".temp").textContent = `${ Math.round( data.main.temp)}°C`;
                document.querySelector(".humidity").textContent = `${data.main.humidity} %`;
                document.querySelector(".wind").textContent = `${data.wind.speed} Km/hr`;
                if(data.weather[0].main == "Clouds"){
                    imgg.src = "images/clouds.png"
                }else if(data.weather[0].main == "Clear"){
                    imgg.src = "/images/clear.png"
                }
                else if(data.weather[0].main == "Rain"){
                    imgg.src = "/images/Rain.png"
                }
                else if(data.weather[0].main == "Drizzle"){
                    imgg.src = "/images/drizzle.png"
                }
                else if(data.weather[0].main == "Mist"){
                    imgg.src = "/images/mist.png"
                }
                document.querySelector(".weather").style.display = "block" ;
                document.querySelector(".err").style.display = "none"

                }
            
        }
        searchbtn.addEventListener("click",()=>{
            checkweather(searchinp.value)
        })
     </script>
</body>
</html>
